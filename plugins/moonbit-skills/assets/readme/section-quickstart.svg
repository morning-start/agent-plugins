<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="sq-title sq-desc">
  <title id="sq-title">快速开始</title>
  <desc id="sq-desc">用自然语言描述需求，Agent 自动选择对应技能。</desc>
  <rect width="1200" height="140" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
  <g transform="translate(56, 0)">
    <rect x="0" y="44" width="32" height="32" rx="8" fill="#58A6FF" fill-opacity="0.15"/>
    <text x="16" y="65" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#58A6FF" text-anchor="middle">1</text>
    <text x="52" y="65" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">快速开始</text>
    <text x="52" y="90" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="14" fill="#8B949E">用自然语言说你想做什么，Agent 自动路由到对应技能</text>
  </g>
  <line x1="56" y1="110" x2="1144" y2="110" stroke="#21262D" stroke-width="1"/>
</svg>