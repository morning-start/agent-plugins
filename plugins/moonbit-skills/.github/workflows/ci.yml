# CI workflow for the MoonBit Skills plugin repository
# See scripts/run-repo-checks.mjs for the single entry point of all checks.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-checks:
    name: Repository Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run repository quality checks
        run: node scripts/run-repo-checks.mjs --skip-shell --verbose

      - name: Validate plugin metadata
        run: node scripts/check-plugin-metadata.mjs
      - name: Validate all JSON schemas
        run: |
          node -e "JSON.parse(require('fs').readFileSync('schemas/moonbit-verification.schema.json', 'utf8'))"

  shell-checks:
    name: Shell Script Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: runner.os == 'Linux'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash syntax (all .sh files)
        run: |
          status=0
          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            bash -n "$file" || { echo "FAILED: $file"; status=1; }
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)
          exit $status

  windows-checks:
    name: Windows Compatibility Checks
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run checks without bash (Windows)
        run: node scripts/run-repo-checks.mjs --skip-shell --verbose

  git-checks:
    name: Git Consistency Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check no merge conflict markers
        run: |
          ! grep -rE '<<<<<<< |=======|>>>>>>> ' --include='*.md' --include='*.mjs' \
            --include='*.json' --include='*.yaml' --include='*.yml' --include='*.sh'
