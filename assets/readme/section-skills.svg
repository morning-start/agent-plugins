<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="ss-title ss-desc">
  <title id="ss-title">十三个核心技能</title>
  <desc id="ss-desc">13 个核心技能按设计、构建、质量和演进阶段组织，每个技能都有明确职责边界。</desc>
  <rect width="1200" height="140" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
  <g transform="translate(56, 0)">
    <rect x="0" y="44" width="32" height="32" rx="8" fill="#3FB950" fill-opacity="0.15"/>
    <text x="16" y="65" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#3FB950" text-anchor="middle">3</text>
    <text x="52" y="65" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3">十三个核心技能</text>
    <text x="52" y="90" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="14" fill="#8B949E">每个技能都有明确的职责边界、触发条件和验证要求</text>
  </g>
  <!-- Skill pills -->
  <g transform="translate(500, 52)">
    <rect x="0" y="0" width="44" height="20" rx="10" fill="#1A2332" stroke="#58A6FF" stroke-width="0.5"/>
    <text x="22" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#58A6FF" text-anchor="middle">init</text>
    <rect x="50" y="0" width="48" height="20" rx="10" fill="#1A2332" stroke="#58A6FF" stroke-width="0.5"/>
    <text x="74" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#58A6FF" text-anchor="middle">plan</text>
    <rect x="104" y="0" width="66" height="20" rx="10" fill="#1A2332" stroke="#58A6FF" stroke-width="0.5"/>
    <text x="137" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#58A6FF" text-anchor="middle">scaffold</text>
    <rect x="176" y="0" width="60" height="20" rx="10" fill="#1A2E23" stroke="#3FB950" stroke-width="0.5"/>
    <text x="206" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#3FB950" text-anchor="middle">testing</text>
    <rect x="242" y="0" width="72" height="20" rx="10" fill="#1A2E23" stroke="#3FB950" stroke-width="0.5"/>
    <text x="278" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#3FB950" text-anchor="middle">implement</text>
    <rect x="320" y="0" width="64" height="20" rx="10" fill="#1A2E23" stroke="#3FB950" stroke-width="0.5"/>
    <text x="352" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#3FB950" text-anchor="middle">perform</text>
    <rect x="390" y="0" width="68" height="20" rx="10" fill="#1A2E23" stroke="#3FB950" stroke-width="0.5"/>
    <text x="424" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#3FB950" text-anchor="middle">refactor</text>
    <rect x="464" y="0" width="52" height="20" rx="10" fill="#2E2619" stroke="#D29922" stroke-width="0.5"/>
    <text x="490" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#D29922" text-anchor="middle">verify</text>
    <rect x="522" y="0" width="66" height="20" rx="10" fill="#2E2619" stroke="#D29922" stroke-width="0.5"/>
    <text x="555" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#D29922" text-anchor="middle">evaluate</text>
    <rect x="594" y="0" width="44" height="20" rx="10" fill="#251E33" stroke="#BC8CFF" stroke-width="0.5"/>
    <text x="616" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#BC8CFF" text-anchor="middle">learn</text>
  </g>
  <line x1="56" y1="110" x2="1144" y2="110" stroke="#21262D" stroke-width="1"/>
