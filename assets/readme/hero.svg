<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">MoonBit Skills — AI Agent 技能集</title>
  <desc id="hero-desc">你决策，Agent 执行。12 个 AI Agent 技能覆盖 MoonBit 项目从规划到发布的完整生命周期。</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#131A24"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
    <linearGradient id="card-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2332"/>
      <stop offset="100%" stop-color="#141D2A"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2E23"/>
      <stop offset="100%" stop-color="#14271D"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E2619"/>
      <stop offset="100%" stop-color="#272014"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#251E33"/>
      <stop offset="100%" stop-color="#1D1728"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="26" fill="url(#bg-grad)" stroke="#21262D" stroke-width="1"/>

  <!-- Subtle grid dots -->
  <g opacity="0.03">
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#58A6FF"/>
    </pattern>
    <rect width="1200" height="380" fill="url(#dots)"/>
  </g>

  <!-- Accent bar at top -->
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#accent-bar)"/>

  <!-- ===== LEFT: Title Area ===== -->
  <g transform="translate(56, 0)">
    <!-- Category badge -->
    <rect x="0" y="52" width="96" height="26" rx="13" fill="rgba(88,166,255,0.12)" stroke="#58A6FF" stroke-width="0.8"/>
    <text x="48" y="69" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="12" font-weight="600" fill="#58A6FF" text-anchor="middle">Developer Tool</text>

    <!-- Project name -->
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="44" font-weight="700" fill="#E6EDF3" letter-spacing="-0.5">MoonBit Skills</text>

    <!-- Tagline -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="600" fill="#F0F6FC">
      <tspan fill="#58A6FF">你决策</tspan>，<tspan fill="#3FB950">Agent 执行</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="204" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16" fill="#8B949E">7 个 AI Agent 技能，覆盖 MoonBit 项目从规划到发布的</text>
    <text x="0" y="228" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16" fill="#8B949E">完整生命周期。用自然语言描述需求，剩下的交给 Agent。</text>

    <!-- Decorative terminal prompt -->
    <rect x="0" y="260" width="220" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="12" y="281" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B949E">
      <tspan fill="#3FB950">$</tspan> <tspan fill="#E6EDF3">我想写一个 TOML 解析器</tspan>
    </text>
    <text x="12" y="301" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#58A6FF">→ 自动触发 moonbit-plan</text>
  </g>

  <!-- ===== RIGHT: 7 Skill Blocks ===== -->
  <g transform="translate(640, 0)">
    <!-- Row 1: init | plan | scaffold | implement -->
    <!-- init -->
    <g transform="translate(0, 68)">
      <rect width="108" height="58" rx="8" fill="url(#card-blue)" stroke="#58A6FF" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="54" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#58A6FF" text-anchor="middle" font-weight="600">✦ init</text>
      <text x="54" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#8B949E" text-anchor="middle">项目初始化</text>
    </g>
    <!-- Arrow -->
    <g transform="translate(112, 93)">
      <line x1="0" y1="0" x2="18" y2="0" stroke="#30363D" stroke-width="1"/>
      <polygon points="18,-3 24,0 18,3" fill="#30363D"/>
    </g>
    <!-- plan -->
    <g transform="translate(140, 68)">
      <rect width="108" height="58" rx="8" fill="url(#card-blue)" stroke="#58A6FF" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="54" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#58A6FF" text-anchor="middle" font-weight="600">📋 plan</text>
      <text x="54" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#8B949E" text-anchor="middle">需求澄清 + 架构</text>
    </g>
    <!-- Arrow -->
    <g transform="translate(252, 93)">
      <line x1="0" y1="0" x2="18" y2="0" stroke="#30363D" stroke-width="1"/>
      <polygon points="18,-3 24,0 18,3" fill="#30363D"/>
    </g>
    <!-- scaffold -->
    <g transform="translate(280, 68)">
      <rect width="108" height="58" rx="8" fill="url(#card-blue)" stroke="#58A6FF" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="54" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#58A6FF" text-anchor="middle" font-weight="600">🏗️ scaffold</text>
      <text x="54" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#8B949E" text-anchor="middle">项目骨架生成</text>
    </g>
    <!-- Arrow -->
    <g transform="translate(392, 93)">
      <line x1="0" y1="0" x2="18" y2="0" stroke="#30363D" stroke-width="1"/>
      <polygon points="18,-3 24,0 18,3" fill="#30363D"/>
    </g>
    <!-- implement -->
    <g transform="translate(420, 68)">
      <rect width="108" height="58" rx="8" fill="url(#card-green)" stroke="#3FB950" stroke-width="0.8" stroke-opacity="0.6"/>
      <text x="54" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#3FB950" text-anchor="middle" font-weight="600">💻 implement</text>
      <text x="54" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#8B949E" text-anchor="middle">TDD 实现 + 调试</text>
    </g>

    <!-- Row 2: verify | evaluate | learn -->
    <!-- Arrow down from implement -->
    <g transform="translate(474, 130)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#30363D" stroke-width="1"/>
      <polygon points="-3,18 0,24 3,18" fill="#30363D"/>
    </g>
    <!-- Arrow from scaffold down to verify -->
    <g transform="translate(334, 130)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#30363D" stroke-width="1"/>
      <polygon points="-3,18 0,24 3,18" fill="#30363D"/>
    </g>

    <!-- verify -->
    <g transform="translate(214, 162)">
      <rect width="108" height="58" rx="8" fill="url(#card-amber)" stroke="#D29922" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="54" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#D29922" text-anchor="middle" font-weight="600">✅ verify</text>
      <text x="54" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#8B949E" text-anchor="middle">质量门禁检查</text>
    </g>
    <!-- Arrow -->
    <g transform="translate(326, 187)">
      <line x1="0" y1="0" x2="18" y2="0" stroke="#30363D" stroke-width="1"/>
      <polygon points="18,-3 24,0 18,3" fill="#30363D"/>
    </g>
    <!-- evaluate -->
    <g transform="translate(354, 162)">
      <rect width="108" height="58" rx="8" fill="url(#card-amber)" stroke="#D29922" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="54" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#D29922" text-anchor="middle" font-weight="600">📊 evaluate</text>
      <text x="54" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#8B949E" text-anchor="middle">验收 + 发布准备</text>
    </g>

    <!-- learn (separate, connected to verify) -->
    <g transform="translate(64, 162)">
      <rect width="108" height="58" rx="8" fill="url(#card-purple)" stroke="#BC8CFF" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="54" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="11" fill="#BC8CFF" text-anchor="middle" font-weight="600">📖 learn</text>
      <text x="54" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#8B949E" text-anchor="middle">从错误中学习</text>
    </g>
    <!-- Arrow from verify to learn (feedback loop) -->
    <g transform="translate(180, 187)">
      <line x1="22" y1="0" x2="0" y2="0" stroke="#BC8CFF" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.5"/>
      <polygon points="0,-3 -6,0 0,3" fill="#BC8CFF" fill-opacity="0.5"/>
    </g>
  </g>

  <!-- Footer metadata -->
  <g transform="translate(56, 340)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#484F58">适用于 Claude Code · Codex · AtomCode</text>
    <text x="500" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#484F58">v1.0 · 7 skills · MoonBit</text>
  </g>
</svg>