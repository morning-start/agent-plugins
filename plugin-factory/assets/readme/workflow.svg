<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%">
  <title>plugin-factory workflow — from intent to lifecycle</title>
  <desc>The full plugin creation pipeline: Intent → Design → Build → Verify → Release → Lifecycle, with Light and Medium/Heavy paths.</desc>

  <!-- Background -->
  <rect width="800" height="300" fill="#0D1117" rx="8"/>

  <!-- Title -->
  <text x="400" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="middle">Full Pipeline</text>

  <!-- Phase 1: Intent -->
  <g transform="translate(20, 55)">
    <rect x="0" y="0" width="110" height="60" rx="6" fill="#1A2332" stroke="#58A6FF" stroke-width="1.5"/>
    <text x="55" y="25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#58A6FF" text-anchor="middle">1. Intent</text>
    <text x="55" y="48" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#8B949E" text-anchor="middle">pf-intent</text>
  </g>

  <!-- Arrow 1→2 -->
  <g transform="translate(130, 80)">
    <text x="0" y="-8" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#30363D" text-anchor="middle">PRD</text>
    <path d="M0,5 L35,5" stroke="#30363D" stroke-width="1.5" marker-end="url(#a)"/>
  </g>

  <!-- Phase 2: Design -->
  <g transform="translate(170, 55)">
    <rect x="0" y="0" width="110" height="60" rx="6" fill="#1A2332" stroke="#D29922" stroke-width="1.5"/>
    <text x="55" y="25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#D29922" text-anchor="middle">2. Design</text>
    <text x="55" y="48" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#8B949E" text-anchor="middle">pf-design</text>
  </g>

  <!-- Arrow 2→3 -->
  <g transform="translate(280, 80)">
    <text x="0" y="-8" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#30363D" text-anchor="middle">manifest</text>
    <path d="M0,5 L35,5" stroke="#30363D" stroke-width="1.5" marker-end="url(#a)"/>
  </g>

  <!-- Phase 3: Build -->
  <g transform="translate(320, 55)">
    <rect x="0" y="0" width="110" height="60" rx="6" fill="#1A2332" stroke="#58A6FF" stroke-width="1.5"/>
    <text x="55" y="25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#58A6FF" text-anchor="middle">3. Build</text>
    <text x="55" y="48" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#8B949E" text-anchor="middle">pf-build</text>
  </g>

  <!-- Arrow 3→4 -->
  <g transform="translate(430, 80)">
    <text x="0" y="-8" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#30363D" text-anchor="middle">TDD</text>
    <path d="M0,5 L35,5" stroke="#30363D" stroke-width="1.5" marker-end="url(#a)"/>
  </g>

  <!-- Phase 4: Verify -->
  <g transform="translate(470, 55)">
    <rect x="0" y="0" width="110" height="60" rx="6" fill="#1A2332" stroke="#3FB950" stroke-width="1.5"/>
    <text x="55" y="25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3FB950" text-anchor="middle">4. Verify</text>
    <text x="55" y="48" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#8B949E" text-anchor="middle">pf-verify</text>
  </g>

  <!-- Arrow 4→5 -->
  <g transform="translate(580, 80)">
    <text x="0" y="-8" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#30363D" text-anchor="middle">pass</text>
    <path d="M0,5 L35,5" stroke="#30363D" stroke-width="1.5" marker-end="url(#a)"/>
  </g>

  <!-- Phase 5: Release -->
  <g transform="translate(620, 55)">
    <rect x="0" y="0" width="110" height="60" rx="6" fill="#1A2332" stroke="#D29922" stroke-width="1.5"/>
    <text x="55" y="25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#D29922" text-anchor="middle">5. Release</text>
    <text x="55" y="48" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#8B949E" text-anchor="middle">/pf-release</text>
  </g>

  <!-- Arrow 5→6 -->
  <g transform="translate(730, 80)">
    <path d="M0,5 L25,5" stroke="#30363D" stroke-width="1.5" marker-end="url(#a)"/>
  </g>

  <!-- Phase 6: Lifecycle -->
  <g transform="translate(20, 140)">
    <rect x="0" y="0" width="110" height="60" rx="6" fill="#1A2332" stroke="#8B949E" stroke-width="1.5"/>
    <text x="55" y="25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#8B949E" text-anchor="middle">6. Lifecycle</text>
    <text x="55" y="48" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#8B949E" text-anchor="middle">pf-lifecycle</text>
  </g>

  <!-- Feedback arrow: Lifecycle → Intent -->
  <path d="M130,170 L360,170 L360,85" stroke="#30363D" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="245" y="164" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#30363D" text-anchor="middle">split / merge / reorganize / port / retire</text>

  <!-- Path indicator labels -->
  <g transform="translate(170, 140)">
    <rect x="0" y="0" width="200" height="60" rx="6" fill="#1A2332" stroke="#30363D" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="100" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3FB950" text-anchor="middle">Light Path</text>
    <text x="100" y="44" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8B949E" text-anchor="middle">1–2 skills, skip design</text>
  </g>

  <g transform="translate(400, 140)">
    <rect x="0" y="0" width="200" height="60" rx="6" fill="#1A2332" stroke="#30363D" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="100" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#D29922" text-anchor="middle">Medium / Heavy Path</text>
    <text x="100" y="44" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8B949E" text-anchor="middle">full pipeline + ADR</text>
  </g>

  <!-- Bottom info: results -->
  <g transform="translate(620, 140)">
    <rect x="0" y="0" width="155" height="60" rx="6" fill="#1A2332" stroke="#30363D" stroke-width="1"/>
    <text x="77" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E6EDF3" text-anchor="middle">Output</text>
    <text x="77" y="44" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8B949E" text-anchor="middle">Standalone plugin project</text>
  </g>

  <!-- Decision diamond: Complexity gate -->
  <g transform="translate(400, 230)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8B949E" text-anchor="middle">Complexity gate determines the path</text>
  </g>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#30363D"/>
    </marker>
  </defs>
</svg>