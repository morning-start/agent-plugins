<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%">
  <title>plugin-factory — A meta-plugin that builds agent plugins</title>
  <desc>A meta-plugin that guides your AI coding agent to create new, standalone agent plugin projects from nothing but your intent.</desc>

  <!-- Background -->
  <rect width="1200" height="400" fill="#0D1117" rx="8"/>

  <!-- Subtle grid pattern -->
  <g stroke="#1A2332" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
  </g>

  <!-- Left: Title Section -->
  <g transform="translate(48, 0)">
    <!-- Terminal prompt -->
    <text x="0" y="60" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#3FB950">$</text>
    <text x="20" y="60" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#8B949E"> npx create-plugin</text>

    <!-- Project name -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#58A6FF" letter-spacing="-1.5">plugin-factory</text>

    <!-- Tagline -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#E6EDF3">A meta-plugin that builds</text>
    <text x="0" y="203" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#3FB950">agent plugins</text>

    <!-- Description -->
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8B949E">Turn a vague idea into a complete, tested,</text>
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8B949E">multi-harness agent plugin project.</text>

    <!-- Badges -->
    <g transform="translate(0, 295)">
      <!-- Version badge -->
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#1A2332" stroke="#30363D" stroke-width="1"/>
      <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">version</text>
      <rect x="80" y="0" width="44" height="24" rx="4" fill="#30363D"/>
      <text x="88" y="16" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#E6EDF3">0.1.0</text>

      <!-- License badge -->
      <rect x="134" y="0" width="60" height="24" rx="4" fill="#1A2332" stroke="#30363D" stroke-width="1"/>
      <text x="142" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">license</text>
      <rect x="194" y="0" width="44" height="24" rx="4" fill="#30363D"/>
      <text x="202" y="16" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#E6EDF3">MIT</text>

      <!-- Test badge -->
      <rect x="248" y="0" width="40" height="24" rx="4" fill="#1A2332" stroke="#30363D" stroke-width="1"/>
      <text x="256" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">tests</text>
      <rect x="288" y="0" width="32" height="24" rx="4" fill="#3FB950"/>
      <text x="294" y="16" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#0D1117">34</text>
    </g>
  </g>

  <!-- Right: Pipeline Flow -->
  <g transform="translate(570, 0)">
    <!-- Section label -->
    <text x="35" y="50" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8B949E" letter-spacing="2">// PIPELINE</text>

    <!-- Row 1: Intent → Design → Build -->
    <!-- Intent -->
    <rect x="0" y="100" width="155" height="52" rx="6" fill="#1A2332" stroke="#58A6FF" stroke-width="1.5"/>
    <text x="77" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#58A6FF" text-anchor="middle">Intent</text>
    <text x="77" y="140" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#8B949E" text-anchor="middle">pf-intent</text>

    <!-- Arrow 1→2 -->
    <path d="M155,126 L179,126" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="167" y="120" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#30363D" text-anchor="middle">PRD</text>

    <!-- Design -->
    <rect x="182" y="100" width="155" height="52" rx="6" fill="#1A2332" stroke="#58A6FF" stroke-width="1.5"/>
    <text x="259" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#58A6FF" text-anchor="middle">Design</text>
    <text x="259" y="140" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#8B949E" text-anchor="middle">pf-design</text>

    <!-- Arrow 2→3 -->
    <path d="M337,126 L361,126" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="349" y="120" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#30363D" text-anchor="middle">manifest</text>

    <!-- Build -->
    <rect x="364" y="100" width="155" height="52" rx="6" fill="#1A2332" stroke="#58A6FF" stroke-width="1.5"/>
    <text x="441" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#58A6FF" text-anchor="middle">Build</text>
    <text x="441" y="140" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#8B949E" text-anchor="middle">pf-build</text>

    <!-- Arrow 3→4 (Build → Verify, curved) -->
    <path d="M441,152 L441,198" stroke="#30363D" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
    <text x="455" y="180" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#30363D">TDD</text>

    <!-- Row 2: Verify → Release → Lifecycle -->
    <!-- Verify -->
    <rect x="0" y="200" width="155" height="52" rx="6" fill="#1A2332" stroke="#3FB950" stroke-width="1.5"/>
    <text x="77" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3FB950" text-anchor="middle">Verify</text>
    <text x="77" y="240" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#8B949E" text-anchor="middle">pf-verify</text>

    <!-- Arrow 4→5 -->
    <path d="M155,226 L179,226" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="167" y="220" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#30363D" text-anchor="middle">pass</text>

    <!-- Release -->
    <rect x="182" y="200" width="155" height="52" rx="6" fill="#1A2332" stroke="#D29922" stroke-width="1.5"/>
    <text x="259" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#D29922" text-anchor="middle">Release</text>
    <text x="259" y="240" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#8B949E" text-anchor="middle">/pf-release</text>

    <!-- Arrow 5→6 -->
    <path d="M337,226 L361,226" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="349" y="220" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#30363D" text-anchor="middle">tag</text>

    <!-- Lifecycle -->
    <rect x="364" y="200" width="155" height="52" rx="6" fill="#1A2332" stroke="#8B949E" stroke-width="1.5"/>
    <text x="441" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#8B949E" text-anchor="middle">Lifecycle</text>
    <text x="441" y="240" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#8B949E" text-anchor="middle">pf-lifecycle</text>

    <!-- Feedback loop arrow (Lifecycle → Intent) -->
    <path d="M519,226 L540,226 L540,126 L519,126" stroke="#30363D" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
    <text x="554" y="180" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#30363D" text-anchor="middle" transform="rotate(90, 554, 180)">feedback</text>

    <!-- Labels -->
    <text x="77" y="90" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#3FB950" text-anchor="middle">▶ Light path</text>
    <text x="259" y="90" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#D29922" text-anchor="middle">▶ Medium/Heavy path</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#30363D"/>
    </marker>
  </defs>

  <!-- Footer: supported harnesses -->
  <g transform="translate(48, 340)">
    <text x="0" y="12" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8B949E" letter-spacing="2">HARNESSES</text>
    <rect x="120" y="0" width="100" height="24" rx="12" fill="#1A2332" stroke="#30363D" stroke-width="1"/>
    <text x="170" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#E6EDF3" text-anchor="middle">Claude Code</text>
    <rect x="230" y="0" width="40" height="24" rx="12" fill="#1A2332" stroke="#30363D" stroke-width="1"/>
    <text x="250" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#E6EDF3" text-anchor="middle">pi</text>
    <rect x="280" y="0" width="70" height="24" rx="12" fill="#1A2332" stroke="#30363D" stroke-width="1"/>
    <text x="315" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#E6EDF3" text-anchor="middle">oh-my-pi</text>
    <rect x="360" y="0" width="70" height="24" rx="12" fill="#1A2332" stroke="#30363D" stroke-width="1"/>
    <text x="395" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#E6EDF3" text-anchor="middle">opencode</text>
  </g>
</svg>