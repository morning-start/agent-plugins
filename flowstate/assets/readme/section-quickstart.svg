<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="130" viewBox="0 0 1200 130"
     role="img" aria-labelledby="s4-title s4-desc">
  <title id="s4-title">快速开始</title>
  <desc id="s4-desc">安装 flowstate 后，会话开始时自动注入 using-fst 入口技能，按场景路由到对应流程技能。</desc>

  <defs>
    <marker id="s4-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L8,5 L0,9 z" fill="#3D4A61"/>
    </marker>
  </defs>

  <rect width="1200" height="130" rx="20" fill="#0B0E14"/>
  <rect x="48" y="24" width="1104" height="82" rx="14" fill="#0F1520" stroke="#212C3D" stroke-width="1.5"/>

  <!-- index + title -->
  <text x="76" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="28" font-weight="700" fill="#4C8DFF">04</text>
  <line x1="126" y1="52" x2="126" y2="80" stroke="#2A3548" stroke-width="2"/>
  <text x="146" y="76" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
        font-size="42" font-weight="700" fill="#F5F7FA">快速开始</text>
  <text x="146" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="16" letter-spacing="1" fill="#8B94A7">INSTALL · BOOTSTRAP · ROUTE</text>

  <!-- motif: install -> bootstrap -> route -->
  <g id="start-flow" transform="translate(560 50)">
    <rect x="0" y="0" width="110" height="30" rx="8" fill="#152238" stroke="#4C8DFF" stroke-width="1.5"/>
    <text x="55" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" fill="#7FB0FF">$ install</text>
    <line x1="114" y1="15" x2="130" y2="15" stroke="#3D4A61" stroke-width="2" marker-end="url(#s4-arrow)"/>
    <rect x="134" y="0" width="150" height="30" rx="8" fill="#141B27" stroke="#2A3548"/>
    <text x="209" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="16" fill="#E6EBF2">SessionStart 注入</text>
    <line x1="288" y1="15" x2="304" y2="15" stroke="#3D4A61" stroke-width="2" marker-end="url(#s4-arrow)"/>
    <rect x="308" y="0" width="190" height="30" rx="8" fill="#141B27" stroke="#2A3548"/>
    <text x="403" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" fill="#E6EBF2">using-fst</text>
  </g>
</svg>
