<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="480" viewBox="0 0 1200 480"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">flowstate — 项目开发全流程规范插件</title>
  <desc id="hero-desc">把开发过程建模为可执行状态图（N1~N9），DoD 守卫与 HITL 人工闸门控制流转。先锁核心底线、边做边补、可控变更、持续校准。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L8,5 L0,9 z" fill="#3D4A61"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="480" rx="26" fill="#0B0E14"/>

  <!-- title block -->
  <g id="title-block">
    <rect x="56" y="56" width="12" height="12" rx="3" fill="#4C8DFF"/>
    <text x="80" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" letter-spacing="2" fill="#4C8DFF">AGENT GRAPH · 开发全流程规范插件</text>

    <text x="56" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="58" font-weight="700" fill="#F5F7FA">flowstate</text>
    <rect x="58" y="132" width="96" height="5" rx="2.5" fill="#4C8DFF"/>

    <text x="56" y="164" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="24" fill="#C9D2E0">把开发过程建模为可执行状态图 —— 先锁核心底线</text>
    <text x="56" y="194" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="24" fill="#C9D2E0">边做边补 · 可控变更 · 持续校准</text>

    <text x="56" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" letter-spacing="1" fill="#8B94A7">6 SKILLS · 4 COMMANDS · 9 SCHEMAS · 4 HARNESSES</text>
  </g>

  <!-- graph board -->
  <g id="graph-board">
    <rect x="48" y="236" width="1104" height="224" rx="18" fill="#0F1520" stroke="#212C3D" stroke-width="1.5"/>

    <!-- faint grid: node boundary guides -->
    <g stroke="#1B2536" stroke-width="1">
      <line x1="238" y1="236" x2="238" y2="460"/>
      <line x1="418" y1="236" x2="418" y2="460"/>
      <line x1="598" y1="236" x2="598" y2="460"/>
      <line x1="778" y1="236" x2="778" y2="460"/>
      <line x1="958" y1="236" x2="958" y2="460"/>
    </g>

    <!-- legend -->
    <g id="legend">
      <polygon points="864,242 872,250 864,258 856,250" fill="#FBBF24"/>
      <text x="882" y="254" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="16" fill="#8B94A7">HITL 人工闸门</text>
      <circle cx="1016" cy="250" r="5.5" fill="#34D399"/>
      <path d="M1013.5,250 l2.2,2.2 l4.4,-4.4" stroke="#0B0E14" stroke-width="2" fill="none"/>
      <text x="1034" y="254" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="16" fill="#8B94A7">DoD 守卫</text>
    </g>

    <!-- row 1: N1 -> N2 -> N3 -> N4 -->
    <g id="row1">
      <rect x="88" y="262" width="150" height="54" rx="12" fill="#141B27" stroke="#2A3548"/>
      <text x="106" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="20" font-weight="700" fill="#4C8DFF">N1</text>
      <text x="150" y="296" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="20" fill="#E6EBF2">立项</text>

      <rect x="268" y="262" width="150" height="54" rx="12" fill="#141B27" stroke="#2A3548"/>
      <text x="286" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="20" font-weight="700" fill="#4C8DFF">N2</text>
      <text x="330" y="296" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="20" fill="#E6EBF2">冻结</text>
      <polygon points="410,252 416,258 410,264 404,258" fill="#FBBF24"/>

      <rect x="448" y="262" width="150" height="54" rx="12" fill="#141B27" stroke="#2A3548"/>
      <text x="466" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="20" font-weight="700" fill="#4C8DFF">N3</text>
      <text x="510" y="296" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="20" fill="#E6EBF2">设计</text>

      <rect x="628" y="262" width="150" height="54" rx="12" fill="#152238" stroke="#4C8DFF" stroke-width="2"/>
      <text x="646" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="20" font-weight="700" fill="#7FB0FF">N4</text>
      <text x="690" y="296" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="20" fill="#E6EBF2">开发</text>
    </g>

    <!-- row1 arrows -->
    <g stroke="#3D4A61" stroke-width="2" fill="none">
      <line x1="242" y1="289" x2="262" y2="289" marker-end="url(#arrow)"/>
      <line x1="422" y1="289" x2="442" y2="289" marker-end="url(#arrow)"/>
      <line x1="602" y1="289" x2="622" y2="289" marker-end="url(#arrow)"/>
    </g>
    <!-- DoD check on N3->N4 -->
    <g id="dod-check-1">
      <circle cx="613" cy="289" r="7" fill="#34D399"/>
      <path d="M609.5,289 l2.6,2.6 l5,-5" stroke="#0B0E14" stroke-width="2" fill="none"/>
    </g>

    <!-- row 2: N6 -> N7 -> N8（主链延续），N5/N9 侧路药丸 -->
    <g id="row2">
      <rect x="628" y="348" width="150" height="54" rx="12" fill="#141B27" stroke="#2A3548"/>
      <text x="646" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="20" font-weight="700" fill="#4C8DFF">N6</text>
      <text x="690" y="382" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="20" fill="#E6EBF2">测试</text>
      <polygon points="770,336 776,342 770,348 764,342" fill="#FBBF24"/>

      <rect x="808" y="348" width="150" height="54" rx="12" fill="#141B27" stroke="#2A3548"/>
      <text x="826" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="20" font-weight="700" fill="#4C8DFF">N7</text>
      <text x="870" y="382" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="20" fill="#E6EBF2">灰度</text>

      <rect x="988" y="348" width="150" height="54" rx="12" fill="#141B27" stroke="#2A3548"/>
      <text x="1006" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="20" font-weight="700" fill="#4C8DFF">N8</text>
      <text x="1050" y="382" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="20" fill="#E6EBF2">回顾</text>
    </g>

    <!-- N5 / N9 侧路药丸（变更 / 紧急） -->
    <g id="side-pills">
      <rect x="88" y="354" width="150" height="42" rx="21" fill="#1B1710" stroke="#FBBF24" stroke-width="1.5"/>
      <text x="106" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="20" font-weight="700" fill="#FBBF24">N5</text>
      <text x="150" y="382" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="20" fill="#F5EFE2">变更</text>

      <rect x="268" y="354" width="150" height="42" rx="21" fill="#1B1710" stroke="#FBBF24" stroke-width="1.5"/>
      <text x="286" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="20" font-weight="700" fill="#FBBF24">N9</text>
      <text x="330" y="382" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="20" fill="#F5EFE2">紧急</text>
    </g>

    <!-- vertical drop N4 -> N6（独立于 N5→N4 的 x=660 通道） -->
    <line x1="703" y1="319" x2="703" y2="344" stroke="#3D4A61" stroke-width="2"/>
    <polygon points="703,348 697,338 709,338" fill="#3D4A61"/>

    <!-- row2 arrows N6 -> N7 -> N8 -->
    <g stroke="#3D4A61" stroke-width="2" fill="none">
      <line x1="782" y1="375" x2="802" y2="375" marker-end="url(#arrow)"/>
      <line x1="962" y1="375" x2="982" y2="375" marker-end="url(#arrow)"/>
    </g>
    <!-- DoD check on N6->N7 -->
    <g id="dod-check-2">
      <circle cx="793" cy="375" r="7" fill="#34D399"/>
      <path d="M789.5,375 l2.6,2.6 l5,-5" stroke="#0B0E14" stroke-width="2" fill="none"/>
    </g>

    <!-- N5 -> N4: 变更归档后回到开发（虚线，终点在 x=660，避开 x=703 垂直通道） -->
    <path d="M163,354 C 280,342 480,334 656,330" fill="none"
          stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polygon points="660,326 652,336 668,336" fill="#FBBF24"/>

    <!-- N9 -> N6: 先修后补单（虚线） -->
    <line x1="424" y1="375" x2="614" y2="375" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polygon points="624,375 614,370 614,380" fill="#FBBF24"/>

    <!-- 迭代闭环 N8 -> N1（沿底部弧线，左侧 x=82 上升，箭头指入 N1 左缘；标签放节点下方空白区） -->
    <path d="M1063,402 C 1063,436 82,436 82,430 L 82,318" fill="none"
          stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
    <polygon points="88,312 76,306 76,318" fill="#34D399"/>
    <text x="523" y="428" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="16" fill="#8B94A7">N8 → N1 迭代闭环 · 持续迭代</text>
  </g>
</svg>
